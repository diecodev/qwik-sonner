name: Deploy website

# Deploys the docs/demo site to the new Deno Deploy (app.deno.com) using the
# `deno deploy` CLI (https://docs.deno.com/runtime/reference/cli/deploy/).
#
# The site is fully prerendered (SSG covers every route), so CI builds it here
# and uploads only the static output in `website/dist` — the remote build step
# has nothing to do. The app was created once with:
#
#   deno deploy create website/dist --org diecodev-ea --app qwik-sonner \
#     --source local --runtime-mode static --static-dir . --region us
#
# Auth uses a deploy token (app.deno.com -> user/org settings -> tokens)
# stored as the DENO_DEPLOY_TOKEN repository secret.

on:
  push:
    branches: [v2] # TODO: switch to main once v2 merges
    paths:
      - website/**
      - src/** # the site consumes the library via workspace:*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch: # allow manual deploys from the Actions tab

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true # only the newest deploy matters

permissions:
  contents: read

env:
  DENO_DEPLOY_ORG: diecodev-ea
  DENO_DEPLOY_APP: qwik-sonner

jobs:
  deploy:
    name: Build & deploy to Deno Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The website imports the workspace-linked library from lib/, so the
      # lib must be built before the site.
      - name: Build library
        run: pnpm build.types && pnpm build.lib

      - name: Build website (client + SSG)
        run: pnpm build.types && pnpm build.client && pnpm build.server
        working-directory: website

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy to Deno Deploy
        run: >-
          deno deploy website/dist
          --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
          --prod --non-interactive
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
